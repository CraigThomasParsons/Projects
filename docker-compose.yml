services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /home/craigpar/Code/Piper/share_inbox:/home/craigpar/Code/Piper/share_inbox
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8083
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    command: [ "sh", "/var/www/html/docker/entrypoint.sh" ]

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8083:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/projects.conf:/etc/nginx/conf.d/default.conf:ro
