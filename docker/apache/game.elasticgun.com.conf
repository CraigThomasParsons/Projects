<VirtualHost *:443>
    ServerName game.elasticgun.com

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/game.elasticgun.com.crt
    SSLCertificateKeyFile /etc/ssl/private/game.elasticgun.com.key

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8687/
    ProxyPassReverse / http://127.0.0.1:8687/

    ErrorLog ${APACHE_LOG_DIR}/game.elasticgun.com-error.log
    CustomLog ${APACHE_LOG_DIR}/game.elasticgun.com-access.log combined
</VirtualHost>
