<VirtualHost *:443>
    ServerName projects.elasticgun.com

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/projects.elasticgun.com.crt
    SSLCertificateKeyFile /etc/ssl/private/projects.elasticgun.com.key

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8182/
    ProxyPassReverse / http://127.0.0.1:8182/

    ErrorLog ${APACHE_LOG_DIR}/projects.elasticgun.com-error.log
    CustomLog ${APACHE_LOG_DIR}/projects.elasticgun.com-access.log combined
</VirtualHost>
